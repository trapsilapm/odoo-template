[options]
; ==============================================================================
; Odoo 17 Configuration File - Standard Self-Hosted Setup
; Reference: https://www.odoo.com/documentation/17.0/developer/reference/cli.html
; ==============================================================================

# Master password for database creation/management
admin_passwd = ChangeThisMasterPassword2026!

# Database Connection Settings
db_host = db
db_port = 5432
db_user = odoo
db_password = SuperSecretPassword123!

# Path Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# Security & Reverse Proxy Settings (Nginx / Cloudflare)
proxy_mode = True
list_db = True

# Performance & Worker Settings (Optimized for 2 vCPU / 2GB RAM + Swap)
workers = 2
max_cron_threads = 1
limit_memory_hard = 1610612736
limit_memory_soft = 1073741824
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
