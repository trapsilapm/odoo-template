version: '3.8'

services:
  web:
    image: odoo:17.0
    container_name: odoo_app
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-Vbcnxmztpm^410}
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./custom_addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo
    restart: always

  db:
    image: postgres:16
    container_name: odoo_db
    environment:
      - POSTGRES_DB=${ODOO_DB:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vbcnxmztpm^410}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

  hermes_agent:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    container_name: odoo_hermes_agent
    depends_on:
      - web
    env_file:
      - .env
    volumes:
      - ./scripts:/app/scripts:ro
    restart: always

volumes:
  odoo-web-data:
  odoo-db-data:
